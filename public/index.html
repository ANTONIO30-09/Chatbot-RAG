<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)">
  <title>Lexio · Asistente de carreras UNIFRANZ</title>
  <meta name="description" content="Pregunta por las mallas, menciones y microcredenciales de Ingeniería de Sistemas e Innovación Digital y de Derecho.">
  <link rel="icon" href="img/avatar.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ios-wallpaper" aria-hidden="true"></div>
  <div class="led-glow" aria-hidden="true"></div>

  <div class="app">
        <header class="topbar">
      <div class="brand">
        <!-- Aquí irá el logotipo de UNIFRANZ -->
        <img src="img/logo.png" alt="UNIFRANZ" class="brand-logo">
      </div>
      <button id="btn-nuevo" class="ghost" type="button">Nueva conversación</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
            <section id="hero" class="hero">
        <div class="hero-visual">
                                          <svg id="svg-chip" class="deco-svg deco-izq" viewBox="0 0 100 100">
          <!-- Contorno del Cerebro (Curvas suaves) -->
          <path d="M 50 25 C 25 25, 15 45, 25 65 C 30 75, 45 85, 50 85 C 55 85, 70 75, 75 65 C 85 45, 75 25, 50 25" />
          
          <!-- Pliegues del Cerebro (Lóbulos) -->
          <path d="M 35 35 Q 45 30 50 40 M 65 35 Q 55 30 50 40" />
          <path d="M 25 55 Q 35 50 45 60 M 75 55 Q 65 50 55 60" />
          <path d="M 35 75 Q 45 70 50 80 M 65 75 Q 55 70 50 80" />
          <path d="M 50 25 L 50 40 M 50 60 L 50 85" /> <!-- Línea media divisoria -->
          
          <!-- El Chip Central (Centrado) -->
          <rect x="42" y="42" width="16" height="16" rx="3" />
          <path d="M 46 46 L 54 46 M 46 50 L 54 50 M 46 54 L 54 54" /> <!-- Detalles internos del chip -->
          
          <!-- Pines y Conexiones del Chip -->
          <path d="M 42 46 L 35 46 Q 30 46 30 40 M 42 54 L 35 54 Q 30 54 30 60" />
          <path d="M 58 46 L 65 46 Q 70 46 70 40 M 58 54 L 65 54 Q 70 54 70 60" />
          <path d="M 46 42 L 46 35 Q 46 30 40 30 M 54 42 L 54 35 Q 54 30 60 30" />
          <path d="M 46 58 L 46 65 Q 46 70 40 70 M 54 58 L 54 65 Q 54 70 60 70" />
          
          <!-- Circuitos Superiores (Nodos redondos) -->
          <path d="M 40 30 Q 35 20 20 20" />
          <circle cx="20" cy="20" r="3" />
          <path d="M 50 25 L 50 10" />
          <circle cx="50" cy="10" r="3" />
          <path d="M 60 30 Q 65 20 80 20" />
          <circle cx="80" cy="20" r="3" />
          
          <!-- Circuitos Inferiores (Nodos redondos) -->
          <path d="M 40 70 Q 35 85 20 85" />
          <circle cx="20" cy="85" r="3" />
          <path d="M 50 85 L 50 95" />
          <circle cx="50" cy="95" r="3" />
          <path d="M 60 70 Q 65 85 80 85" />
          <circle cx="80" cy="85" r="3" />
          
          <!-- Circuitos Laterales (Nodos redondos) -->
          <path d="M 25 55 L 10 55" />
          <circle cx="10" cy="55" r="3" />
          <path d="M 75 55 L 90 55" />
          <circle cx="90" cy="55" r="3" />
        </svg>
        <img id="avatar-hero" class="hero-avatar" src="img/avatar.png" alt="Asistente virtual">
        </div>
                <div class="hero-content">
                                        <svg id="svg-balanza" class="deco-svg deco-der" viewBox="0 0 100 100">
            <!-- Base -->
            <path d="M 30 90 Q 50 80 70 90 L 70 92 L 30 92 Z" />
            <!-- Pilar Central -->
            <path d="M 50 90 L 50 40" />
            <!-- Círculo Central (Pivote) -->
            <circle cx="50" cy="40" r="4" />
            <!-- Barra Inclinada -->
            <path d="M 15 50 L 85 30" />
            <!-- Cuerdas Izquierdas -->
            <path d="M 15 50 L 5 75 M 15 50 L 25 75" />
            <!-- Plato Izquierdo -->
            <path d="M 0 75 Q 15 85 30 75" />
            <!-- Cuerdas Derechas -->
            <path d="M 85 30 L 75 55 M 85 30 L 95 55" />
            <!-- Plato Derecho -->
            <path d="M 70 55 Q 85 65 100 55" />
          </svg>
          <h1>Lexio</h1>
          <p class="lexio-meaning"><strong>Lex</strong> (Derecho) + <strong>I/O</strong> (Sistemas).</p>
          <p>Soy tu guía. Pregúntame por las mallas, menciones, microcredenciales y el campo laboral de Ingeniería de Sistemas e Innovación Digital y de Derecho.</p>
          <div id="chips" class="chips">
            <button class="chip" type="button" data-q="¿Qué es una microcredencial y para qué sirve?">¿Qué es una microcredencial?</button>
            <button class="chip" type="button" data-q="¿Cuándo se elige la mención?">¿Cuándo se elige la mención?</button>
            <button class="chip" type="button" data-q="¿Qué menciones tiene Ingeniería de Sistemas?">Menciones de Sistemas</button>
            <button class="chip" type="button" data-q="¿Qué menciones tiene Derecho?">Menciones de Derecho</button>
            <button class="chip" type="button" data-q="¿Cuánto dura cada carrera?">¿Cuánto dura cada carrera?</button>
            <button class="chip" type="button" data-q="¿Dónde podría trabajar al egresar?">¿Dónde podría trabajar?</button>
          </div>
        </div>
      </section>
      <div id="mensajes" class="mensajes"></div>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <button id="btn-mic" class="icon-btn" type="button" hidden aria-label="Hablar con el micrófono">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <textarea id="entrada" rows="1" maxlength="600" placeholder="Escribe tu pregunta…" aria-label="Tu pregunta"></textarea>
      <button id="btn-enviar" class="send" type="submit" aria-label="Enviar pregunta">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6v6.4l12 2-12 2z"/></svg>
      </button>
    </form>
    
  </div>

  <script src="js/chat.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/avatar.js"></script>
</body>
</html>
